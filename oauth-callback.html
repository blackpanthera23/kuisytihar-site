<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Threads authorization callback</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3eedf">
  <style>
    :root { --paper: #f3eedf; --ink: #171912; --muted: #55584e; --green: #116b43; --rule: #aaa48f; }
    body {
      margin: 0; padding: clamp(24px, 6vw, 64px);
      background: var(--paper); color: var(--ink);
      font-family: Arial, Helvetica, sans-serif; line-height: 1.6;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.03em; margin: 0 0 8px; }
    p { margin: 0 0 18px; }
    .lede { color: #34372f; font-size: 1.06rem; }
    .card { border-top: 1px solid var(--ink); padding-top: 22px; margin-top: 30px; }
    code, .code {
      display: block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .95rem; background: #fbf8ef; border: 1px solid var(--rule);
      padding: 14px 16px; margin: 0 0 14px; word-break: break-all; white-space: pre-wrap;
      user-select: all;
    }
    .missing { border-left: 3px solid var(--green); padding-left: 16px; }
    .hint { color: var(--muted); font-size: .92rem; }
    button {
      font: inherit; font-weight: 700; cursor: pointer;
      background: var(--ink); color: var(--paper); border: 0;
      padding: 12px 20px; margin-bottom: 18px;
    }
    a { color: inherit; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Checking the callback…</h1>
    <p class="lede" id="lede"></p>
    <div id="body"></div>
    <div class="card">
      <p class="hint">This page exists to receive the Threads OAuth redirect for the Kesidang Threads app.
      It shows the authorization code so it can be pasted into the terminal. It stores nothing and sends
      nothing anywhere. See the <a href="/privacy.html">privacy policy</a>.</p>
    </div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var error = params.get('error') || params.get('error_message') || params.get('error_code');
      var desc = params.get('error_description');
      var title = document.getElementById('title');
      var lede = document.getElementById('lede');
      var body = document.getElementById('body');

      function show(text, cls) {
        var el = document.createElement('div');
        el.className = 'code' + (cls ? ' ' + cls : '');
        el.textContent = text;
        body.appendChild(el);
      }

      if (code) {
        title.textContent = 'Authorization code received';
        lede.textContent = 'Copy the value below, then paste it into the exchange command in the terminal.';
        show(code);
        var btn = document.createElement('button');
        btn.textContent = 'Copy code';
        btn.onclick = function () {
          navigator.clipboard.writeText(code).then(function () {
            btn.textContent = 'Copied';
          }, function () {
            btn.textContent = 'Select the code above and copy manually';
          });
        };
        body.insertBefore(btn, body.firstChild);
        var cmd = document.createElement('div');
        cmd.className = 'hint';
        cmd.style.marginBottom = '14px';
        cmd.textContent = 'Then run:';
        body.appendChild(cmd);
        show('python3 ~/.hermes/scripts/threads/threads_oauth.py exchange --code ' + code);
      } else if (error) {
        title.textContent = 'Authorization was refused';
        lede.textContent = 'Threads returned an error instead of a code.';
        show(String(error));
        if (desc) show(String(desc));
        var back = document.createElement('p');
        back.innerHTML = 'Nothing was changed. Retry from the start, or check the app settings.';
        body.appendChild(back);
      } else {
        title.textContent = 'No authorization code in this URL';
        lede.textContent = 'This page is the OAuth redirect target. Open it with ?code=… appended by Threads.';
        var box = document.createElement('div');
        box.className = 'missing';
        box.innerHTML = '<p>It does nothing on its own, which is expected when opened directly.</p>';
        body.appendChild(box);
      }
    })();
  </script>
</body>
</html>
